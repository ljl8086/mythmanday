name: Rust & Frontend CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check-and-test:
    name: Lint, Test & Build Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Frontend Lint & Build Check
        run: |
          cd frontend
          pnpm install
          pnpm run lint
          pnpm build

      - name: Rust Formatting & Clippy Check
        run: |
          cargo fmt -- --check
          cargo clippy --workspace --no-deps

      - name: Rust Cargo Check & Unit Tests
        run: |
          cargo check --workspace
          cargo test -p myth-core -p myth-db -p myth-git -p myth-ai
