name: Release Multi-Platform Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    name: Build Linux .deb & tar.gz
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Build Frontend
        run: |
          cd frontend
          pnpm install
          pnpm build

      - name: Build Release Binary
        run: |
          cargo build --release --bin mythmanday-app

      - name: Package .deb & tar.gz
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh
          tar -czf dist/mythmanday_${{ github.ref_name }}_linux_x86_64.tar.gz -C target/release mythmanday-app
          cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS.txt

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Ubuntu Launchpad PPA
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_TARGET: ppa:ljl8086/ppa
          GPG_KEY_ID: E7BAFF8B2E1CFD95
        run: |
          if [ -z "$PPA_GPG_PRIVATE_KEY" ]; then
            echo "PPA_GPG_PRIVATE_KEY not configured, skipping PPA upload."
            exit 0
          fi
          sudo apt-get install -y devscripts debhelper dput gnupg
          echo "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "A53EFED13CF55A5B4E2DD368E7BAFF8B2E1CFD95:6:" | gpg --import-ownertrust
          chmod +x ./scripts/publish-ppa.sh
          ./scripts/publish-ppa.sh "$PPA_TARGET" "$GPG_KEY_ID"

