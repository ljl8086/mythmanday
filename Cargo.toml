[workspace]
resolver = "2"
members = [
    "crates/myth-core",
    "crates/myth-db",
    "crates/myth-git",
    "crates/myth-ai",
    "crates/myth-audio",
    "crates/myth-desktop",
    "crates/myth-app",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["ljl8086 <ljl8086@126.com>"]
license = "MIT"
description = "人天神话-开发者人天中台 (MythManDay) 桌面引擎"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = "0.3"
